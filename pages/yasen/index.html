<!doctype html>
<html lang="">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
		<title>index</title>
		<link rel="stylesheet" href="hero_glass.css" media="screen" />
	</head>
	<body>
		<a class="home-sigil" href="/" aria-label="Home"> ∴ ⊢ ⟡ HOME / INDEX ⟡ ⊣ ∴ </a>
		<h1 id="index">PTY Media</h1>
		<main id="main">Loading media...</main>

		<style></style>
		<script>
			fetch("media_snippet.html")
				.then((response) => {
					if (!response.ok) throw new Error("Network response was not ok");
					return response.text();
				})
				.then((html) => {
					document.getElementById("main").innerHTML = html;
				})
				.catch((error) => {
					document.getElementById("main").innerHTML = "<p>Could not load media snippet.</p>";
					console.error("Error loading snippet:", error);
				});
		</script>
	</body>
</html>
